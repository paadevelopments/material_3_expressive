publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  material_3_expressive:
    path: ../
  cupertino_icons: ^1.0.8

dev_dependencies:
